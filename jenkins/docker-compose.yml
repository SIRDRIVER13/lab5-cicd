# Uruchomienie: cd jenkins && docker compose up -d --build   ->   http://localhost:8080 (admin / admin)
services:
  jenkins:
    build: .
    container_name: jenkins
    user: root   # dostęp do gniazda Dockera hosta (środowisko laboratoryjne)
    ports:
      - "8080:8080"
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  jenkins-home:
