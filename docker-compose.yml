# Jeden plik dla obu środowisk - Jenkins uruchamia go jako osobne projekty:
#   test:       docker compose -p task-api-test  (port 8081)
#   produkcja:  docker compose -p task-api-prod  (port 8082)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks"]
      interval: 5s
      retries: 10

  app:
    build: .
    image: ${APP_IMAGE:-task-api:local}
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://tasks:tasks@db:5432/tasks
      APP_ENV: ${APP_ENV:-local}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
